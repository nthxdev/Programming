    <div class="info-bar">
        <div class="cursor-info">
            <p>clientX: <span id="clientX">0</span></p>
            <p>clientY: <span id="clientY">0</span></p>
        </div>
    </div>

    <div class="watermark">

                    transform="rotate(240 12 12)" />

                <linearGradient id="bladeGrad" x1="18" y1="3" x2="30" y2="23" gradientUnits="userSpaceOnUse">

                    <stop offset="0.55" stop-color="#C7C9CC" />
                    <stop offset="1" stop-color="#84878C" />

            </defs>
            <path
                d="M23 43 C29 44 34.5 46.5 33.8 51.2 C33.3 54.8 27.4 55.2 25.7 51.7 C28.7 51 30.4 48.4 27.8 46.3 C26.2 45 24.3 44.3 23 43 Z"

            <circle cx="24" cy="41.2" r="4.4" fill="none" stroke="#181818" stroke-width="2.6" />

            <line x1="24" y1="6" x2="24" y2="19" stroke="#9a9da1" stroke-width="0.8" />
        </svg>
    </div>

    <div id="follower"></div>

    <div class="eye-box">
        <svg id="eye" viewBox="0 0 2048 2048" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="sharinganPattern" patternUnits="objectBoundingBox" x="0" y="0" width="1" height="1"
                    viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="12" fill="#8f0f18" />
                    <circle cx="12" cy="12" r="11.2" fill="#c41e2a" stroke="#050505" stroke-width="1" />
                    <g fill="#050505">
                        <path d="M12,9.9 C16.08,9.56 15.4,5.48 12,3.1 C8.6,5.48 7.92,9.56 12,9.9 Z"

                        <path d="M12,9.9 C16.08,9.56 15.4,5.48 12,3.1 C8.6,5.48 7.92,9.56 12,9.9 Z"

                            transform="rotate(240 12 12)" />
                    </g>
                    <circle cx="12" cy="12" r="1.8" fill="#050505" />

            <circle id="pupil" cx="1086" cy="1026" r="119" fill="url(#sharinganPattern)" />

    <section class="page" id="page-2">
        <div class="form-div">
            <div class="wrap">
                <h1>Akatsuki Registration</h1>
                <p>Enter Your Name and skill set with resume.</p>
            </div>
            <form id="form">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="name" name="username" autocomplete="username">
                <div class="btn-div">
                    <button id="btn-form" type="button">Event button</button>
                </div>
            </form>
        </div>
    </section>
    <section class="page" id="page-3">
